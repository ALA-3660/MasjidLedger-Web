      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="55%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
