<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#065f46" />
    <title>অফলাইন মোড — মসজিদ লেজার</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Hind Siliguri', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(145deg, #ecfdf5 0%, #f0fdfa 50%, #f8fafc 100%);
        color: #0f172a;
        padding: 20px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        border: 1px solid #a7f3d0;
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 18px 40px -15px rgba(6, 95, 70, 0.18);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #fef3c7;
        color: #92400e;
        border: 1px solid #fcd34d;
        border-radius: 999px;
        padding: 5px 14px;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 16px;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: linear-gradient(135deg, #065f46, #0f766e);
        margin: 0 auto 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 24px -8px rgba(6, 95, 70, 0.45);
      }
      .logo img {
        width: 54px;
        height: 54px;
        border-radius: 12px;
      }
      h1 {
        font-size: 21px;
        font-weight: 800;
        color: #064e3b;
        margin-bottom: 10px;
      }
      p {
        font-size: 14px;
        line-height: 1.7;
        color: #475569;
        margin-bottom: 22px;
      }
      button {
        width: 100%;
        padding: 12px 18px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #059669, #0f766e);
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 18px -6px rgba(5, 150, 105, 0.5);
      }
      button:active { transform: scale(0.98); }
      .foot {
        margin-top: 16px;
        font-size: 12px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <img src="/pwa-192x192.png" alt="মসজিদ লেজার" onerror="this.style.display='none'" />
      </div>
      <div class="badge">● অফলাইন মোড সক্রিয়</div>
      <h1>ইন্টারনেট সংযোগ বিচ্ছিন্ন রয়েছে</h1>
      <p>
        আপনার মোবাইলে এই মুহূর্তে ইন্টারনেট সংযোগ নেই। সংযোগ ফিরে এলে নিচের বাটনে ট্যাপ করে পুনরায়
        <strong>মসজিদ লেজার</strong> চালু করুন — আপনার সকল হিসাব নিরাপদে সংরক্ষিত আছে।
      </p>
      <button type="button" onclick="window.location.reload()">পুনরায় চেষ্টা করুন</button>
      <div class="foot">মসজিদ লেজার — আধুনিক মসজিদ ব্যবস্থাপনা সফটওয়্যার</div>
    </div>
  </body>
</html>
